services:
  db:
    image: postgres:16-alpine
    container_name: survey_bot_db
    environment:
      POSTGRES_DB: survey_bot
      POSTGRES_USER: survey_user
      POSTGRES_PASSWORD: survey_password
    expose:
      - "5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U survey_user -d survey_bot"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build: ./backend
    container_name: survey_bot_backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://survey_user:survey_password@db:5432/survey_bot
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
    command: sh -c "alembic upgrade head && python -m app.seed && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s

  bot:
    build: ./bot
    container_name: survey_bot_telegram
    env_file: .env
    environment:
      API_BASE_URL: http://backend:8000/api/v1
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: survey_bot_frontend
    environment:
      VITE_API_URL: http://localhost:8000/api/v1
    ports:
      - "127.0.0.1:5173:5173"
    depends_on:
      - backend

volumes:
  postgres_data:
